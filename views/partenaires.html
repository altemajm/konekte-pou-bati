<section>
  <div class="container">
    <h1 class="section-title">{{partenairesTitle}}</h1>
    <p class="section-sub">{{partenairesSub}}</p>

    <div class="tiers-grid">
      <div class="tier-card">
        <h3>{{tierOfficielTitle}}</h3>
        <p>{{tierOfficielDesc}}</p>
      </div>
      <div class="tier-card">
        <h3>{{tierOrTitle}}</h3>
        <p>{{tierOrDesc}}</p>
      </div>
      <div class="tier-card">
        <h3>{{tierArgentTitle}}</h3>
        <p>{{tierArgentDesc}}</p>
      </div>
      <div class="tier-card">
        <h3>{{tierBronzeTitle}}</h3>
        <p>{{tierBronzeDesc}}</p>
      </div>
    </div>

    {{{message}}}

    <h2 class="section-title" style="margin-top:50px;">{{partenaireFormTitle}}</h2>
    <form class="form-card" method="POST" action="/partenaires">
      <label for="organisation">{{labelOrganisation}} *</label>
      <input type="text" id="organisation" name="organisation" required />

      <label for="contact">{{labelContact}} *</label>
      <input type="text" id="contact" name="contact" required />

      <label for="email">{{labelEmail}} *</label>
      <input type="email" id="email" name="email" required />

      <label for="palier">{{labelPalier}}</label>
      <select id="palier" name="palier">
        <option value="officiel">{{palierOfficiel}}</option>
        <option value="or">{{palierOr}}</option>
        <option value="argent">{{palierArgent}}</option>
        <option value="bronze">{{palierBronze}}</option>
        <option value="nature">{{palierNature}}</option>
      </select>

      <label for="message">{{labelMessage}}</label>
      <textarea id="message" name="message"></textarea>

      <button type="submit" class="btn btn-primary form-submit">{{btnEnvoyer}}</button>
    </form>
  </div>
</section>
